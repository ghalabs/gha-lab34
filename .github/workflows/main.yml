name: Custom Action Security
on: [push]
 
jobs:
  security-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
 
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # This caches your dependencies so the next run is faster!
          cache: 'npm'
          cache-dependency-path: '.github/actions/secret-scanner/package.json'
 
      - name: Install Scanner Dependencies
        run: npm install
        working-directory: .github/actions/secret-scanner

      - name: Run Secret Scanner Custom Action
        # Invoking the action via its manifest (action.yml)
        uses: ./.github/actions/secret-scanner
        with:
          search_path: 'backend/src/config'
          fail_on_missing: 'true'